# ── Nginx Reverse Proxy Configuration ────────────────────────────────────────
# Routes:
#   /api/jobs/*          → jobs-service:8000
#   /api/applications/*  → applications-service:3001
#   /*                   → frontend:8080  (non-root nginx can't bind :80)

upstream jobs_service {
    server jobs-service:8000;
}

upstream applications_service {
    server applications-service:3001;
}

upstream frontend_service {
    server frontend:8080;
}

server {
    listen 80;
    server_name localhost;

    # ── Task 6.2: Content Security Policy Headers ─────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Jobs API ──────────────────────────────────────────────────────────
    location /api/jobs/ {
        proxy_pass         http://jobs_service/jobs/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Applications API ──────────────────────────────────────────────────
    location /api/applications/ {
        proxy_pass         http://applications_service/applications/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Health checks (direct access) ────────────────────────────────────
    location /health/jobs {
        proxy_pass http://jobs_service/health;
    }

    location /health/applications {
        proxy_pass http://applications_service/health;
    }

    # ── Frontend (catch-all) ──────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend_service/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
